name: Cleaning Checklist Templates
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/properties/CleaningChecklistCard*'
      - 'src/components/properties/cleaningChecklistPresets.ts'
      - 'src/api/cleaning-checklist.ts'
      - '.github/workflows/cleaning-checklist-presets.yml'
permissions:
  contents: read
jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test src/components/properties/CleaningChecklistCard.runtime.test.mjs
      - run: npx eslint src/components/properties/CleaningChecklistCard.tsx src/components/properties/cleaningChecklistPresets.ts
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/components/properties/CleaningChecklistCard.tsx src/components/properties/cleaningChecklistPresets.ts
      - run: npm run build
