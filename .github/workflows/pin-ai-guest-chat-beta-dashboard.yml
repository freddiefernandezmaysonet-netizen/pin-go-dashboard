name: Pin AI Guest Chat Beta Dashboard Certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pin-ai-guest-chat-beta-dashboard.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/pages/public-booking/GuestPinAIChat.tsx'
      - 'src/pages/public-booking/pinAIProposalExpiry.ts'
      - 'src/pages/public-booking/GuestCancellationPage.tsx'
      - 'src/pages/public-booking/guestPinAIChat.contract.test.js'
      - 'src/pages/public-booking/guestPinAIChat.interaction.test.js'

permissions:
  contents: read

jobs:
  certify:
    name: Guest chat contract, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:pin-ai-guest-chat
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM src/pages/public-booking/GuestPinAIChat.tsx
      - run: npx eslint src/pages/public-booking/pinAIProposalExpiry.ts
