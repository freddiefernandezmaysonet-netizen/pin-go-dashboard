name: Connection Center Certified Full Sync Restore

on:
  push:
    branches:
      - agent/connection-center-certified-full-sync-restore
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/connection-center-certified-full-sync-restore.yml"
      - "src/api/distributionFullSync.ts"
      - "src/api/distributionFullSync.contract.test.js"
      - "src/app/routes/router.tsx"
      - "src/components/distribution/ConnectionCenterFullSyncControl.tsx"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Full Sync and current Airbnb mapping contracts
        run: |
          node --test \
            src/api/distributionFullSync.contract.test.js \
            src/pages/distribution/AirbnbAutomaticListingDiscovery.contract.test.js

      - name: Build dashboard without deployment
        run: npm run build

      - name: Prove exact restoration or protected Full Sync scope
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          if [ "$branch" = "agent/booking-com-integrated-closure" ]; then
            python3 .github/scripts/verify-booking-com-integrated-scope.py
            exit 0
          fi

          git fetch origin main --depth=1

          if [ "$branch" = "agent/connection-center-certified-full-sync-restore" ]; then
            git diff --name-only origin/main...HEAD | sort > "$RUNNER_TEMP/actual.txt"
            cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/connection-center-certified-full-sync-restore.yml
          src/api/distributionFullSync.contract.test.js
          src/api/distributionFullSync.ts
          src/app/routes/router.tsx
          src/components/distribution/ConnectionCenterFullSyncControl.tsx
          EOF
            sort "$RUNNER_TEMP/expected.txt" -o "$RUNNER_TEMP/expected.txt"
            diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi

          # Other PRs may legitimately touch router.tsx. Keep the certified Full Sync
          # implementation frozen and prove its route mount still exists instead of
          # requiring every unrelated PR to match the historical restoration diff.
          git diff --exit-code origin/main...HEAD -- \
            src/api/distributionFullSync.contract.test.js \
            src/api/distributionFullSync.ts \
            src/components/distribution/ConnectionCenterFullSyncControl.tsx

          grep -q 'ConnectionCenterFullSyncControl' src/app/routes/router.tsx
          grep -q '<ConnectionCenterFullSyncControl />' src/app/routes/router.tsx

      - name: Prove existing OTA behavior surfaces remain frozen or exactly reviewed
        run: |
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "agent/booking-com-integrated-closure" ]; then
            python3 .github/scripts/verify-booking-com-integrated-scope.py
            node --test .github/scripts/dashboard-typescript-zero.test.mjs
            exit 0
          fi
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git diff --exit-code origin/main...HEAD -- \
            src/api/distribution.ts \
            src/api/distribution.contract.test.js \
            src/api/airbnbHostSelfService.ts \
            src/pages/distribution/ConnectionCenterPage.tsx \
            src/pages/distribution/AirbnbConnectionCallbackPage.tsx \
            src/lib/distributionFramePolicy.ts

          if [ "$branch" = "agent/property-calendar-responsive-v1" ]; then
            node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const guard = "agent/property-calendar-responsive-v1";
          const current = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
          const baseline = JSON.parse(
            execFileSync("git", ["show", "origin/main:vercel.json"], { encoding: "utf8" }),
          );

          assert.equal(
            current?.git?.deploymentEnabled?.[guard],
            false,
            "responsive branch must remain protected from automatic Vercel deployment",
          );
          delete current.git.deploymentEnabled[guard];
          assert.deepEqual(
            current,
            baseline,
            "vercel.json may differ from main only by the exact responsive branch deployment guard",
          );
          JS
          elif [ "$branch" = "agent/property-stay-time-settings-v1" ]; then
            # Draft #177 already blocks deployment. Permit only that exact guard;
            # retain the frozen OTA checks above and Full Sync checks below.
            test "$GITHUB_EVENT_NAME" = "pull_request"
            test "$GITHUB_REPOSITORY" = "freddiefernandezmaysonet-netizen/pin-go-dashboard"
            node --input-type=module - <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          assert.equal(event.pull_request.number, 177);
          assert.equal(event.pull_request.head.repo.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(event.pull_request.base.repo.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(event.pull_request.base.ref, "main");
          const guard = "agent/property-stay-time-settings-v1";
          const current = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
          const base = execFileSync("git", ["merge-base", "origin/main", "HEAD"], { encoding: "utf8" }).trim();
          const baseline = JSON.parse(execFileSync("git", ["show", `${base}:vercel.json`], { encoding: "utf8" }));
          assert.equal(current.git.deploymentEnabled[guard], false);
          baseline.git.deploymentEnabled[guard] = false;
          assert.deepEqual(current, baseline, "Only Draft #177's deployment block may differ");
          JS
          else
            git diff --exit-code origin/main...HEAD -- vercel.json
          fi

      - name: Prove Full Sync cannot map activate or import
        run: |
          ! grep -E '/mappings|/activate|load_future_reservations|confirmAirbnbHostMapping|issueAirbnbHostConnectionLink' \
            src/api/distributionFullSync.ts \
            src/components/distribution/ConnectionCenterFullSyncControl.tsx
