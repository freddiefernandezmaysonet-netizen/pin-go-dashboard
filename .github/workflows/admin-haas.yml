name: Hardware as a Service Admin
on:
  pull_request:
    paths:
      - 'src/pages/admin/AdminHaasPage.tsx'
      - 'src/pages/admin/AdminHaasPage.css'
      - 'src/app/routes/router.tsx'
      - 'src/app/layout/AppShell.tsx'
      - 'tests/admin-haas.browser.mjs'
      - '.github/workflows/admin-haas.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint src/pages/admin/AdminHaasPage.tsx
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/pages/admin/AdminHaasPage.tsx
      - run: npm run build
      - run: npm install --prefix /tmp/haas-playwright --no-audit --no-fund playwright@1.58.2
      - run: node /tmp/haas-playwright/node_modules/playwright/cli.js install chromium --only-shell
      - run: node tests/admin-haas.browser.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/haas-playwright/node_modules/playwright/index.mjs
