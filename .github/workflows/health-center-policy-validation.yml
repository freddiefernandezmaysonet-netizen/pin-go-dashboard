name: Health Center Dashboard Validation

on:
  push:
    branches:
      - agent/health-center-policy-alignment
    paths:
      - ".github/workflows/health-center-policy-validation.yml"
      - "src/pages/health-center/HealthCenterPage.tsx"
      - "src/pages/health-center/HealthCenterPage.gateway-policy.contract.test.mjs"
      - "src/services/health.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gateway presentation contract
        run: node --test src/pages/health-center/HealthCenterPage.gateway-policy.contract.test.mjs
      - name: Dashboard build
        run: npm run build
