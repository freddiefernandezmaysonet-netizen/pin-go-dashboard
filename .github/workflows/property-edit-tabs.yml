name: Property Edit Tabs
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/properties/PropertyEditPage*'
      - 'src/components/properties/PropertyEditTabs*'
      - 'tests/property-edit.browser.mjs'
      - '.github/workflows/property-edit-tabs.yml'
permissions:
  contents: read
jobs:
  property-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test src/components/properties/PropertyEditTabs.runtime.test.mjs src/pages/properties/PropertyPostalCode.contract.test.js src/components/properties/CleaningChecklistCard.runtime.test.mjs
      - run: npx eslint src/components/properties/PropertyEditTabs.tsx
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/pages/properties/PropertyEditPage.tsx src/components/properties/PropertyEditTabs.tsx
      - run: npm run build
      - run: npm install --prefix /tmp/property-playwright --no-audit --no-fund playwright@1.58.2
      - run: node /tmp/property-playwright/node_modules/playwright/cli.js install --with-deps chromium
      - run: node tests/property-edit.browser.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/property-playwright/node_modules/playwright/index.mjs
          PROPERTY_EDIT_TEST_OUTPUT: /tmp/property-edit-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-edit-screenshots
          path: /tmp/property-edit-browser
