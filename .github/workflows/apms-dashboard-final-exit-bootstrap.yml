name: APMS Dashboard Final Exit Bootstrap

on:
  push:
    branches:
      - agent/apms-dashboard-final-exit-closure

permissions:
  contents: write

jobs:
  finalize-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: agent/apms-dashboard-final-exit-closure
          fetch-depth: 0

      - name: Verify fenced base and bootstrap scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=b7b76ece93071952ad6e7d2d92fbe923cbbcff43
          test "$(git rev-parse HEAD^)" = "$BASE"
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/scripts/apms_property_calendar_final_exit.py',
              '.github/workflows/apms-dashboard-final-exit-bootstrap.yml',
              'src/app/layout/AppShell.tsx',
              'src/app/routes/router.tsx',
              'src/lib/apmsMissionControlPresentation.js',
              'src/lib/apmsMissionControlPresentation.test.mjs',
              'src/pages/ApmsDecisionHistoryPage.tsx',
              'src/pages/DeviceAutomationHistoryPage.tsx',
          }
          changed = set(subprocess.check_output([
              'git','diff','--name-only',
              'b7b76ece93071952ad6e7d2d92fbe923cbbcff43','HEAD'
          ], text=True).splitlines())
          extra = changed - allowed
          missing = allowed - changed
          if extra or missing:
              raise SystemExit(f'bootstrap scope mismatch extra={sorted(extra)} missing={sorted(missing)}')
          print('bootstrap scope PASS')
          PY

      - name: Apply exact fail-closed Property Calendar closure
        run: python .github/scripts/apms_property_calendar_final_exit.py

      - name: Certify Mission Control presentation helpers
        run: node --test src/lib/apmsMissionControlPresentation.test.mjs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

      - name: Verify final source scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/scripts/apms_property_calendar_final_exit.py',
              '.github/workflows/apms-dashboard-final-exit-bootstrap.yml',
              'src/app/layout/AppShell.tsx',
              'src/app/routes/router.tsx',
              'src/lib/apmsMissionControlPresentation.js',
              'src/lib/apmsMissionControlPresentation.test.mjs',
              'src/pages/ApmsDecisionHistoryPage.tsx',
              'src/pages/DeviceAutomationHistoryPage.tsx',
              'src/pages/properties/PropertyCalendarPage.tsx',
          }
          changed = set(subprocess.check_output([
              'git','diff','--name-only',
              'b7b76ece93071952ad6e7d2d92fbe923cbbcff43'
          ], text=True).splitlines())
          extra = changed - allowed
          if extra:
              raise SystemExit(f'final scope exceeded: {sorted(extra)}')
          if 'src/pages/properties/PropertyCalendarPage.tsx' not in changed:
              raise SystemExit('PropertyCalendarPage closure missing')
          print('final source scope PASS')
          PY

      - name: Remove bootstrap-only files
        run: |
          rm .github/scripts/apms_property_calendar_final_exit.py
          rm .github/workflows/apms-dashboard-final-exit-bootstrap.yml

      - name: Commit certified final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              'src/app/layout/AppShell.tsx',
              'src/app/routes/router.tsx',
              'src/lib/apmsMissionControlPresentation.js',
              'src/lib/apmsMissionControlPresentation.test.mjs',
              'src/pages/ApmsDecisionHistoryPage.tsx',
              'src/pages/DeviceAutomationHistoryPage.tsx',
              'src/pages/properties/PropertyCalendarPage.tsx',
          }
          final = set(subprocess.check_output([
              'git','diff','--cached','--name-only',
              'b7b76ece93071952ad6e7d2d92fbe923cbbcff43'
          ], text=True).splitlines())
          if final != expected:
              raise SystemExit(f'final tree mismatch: {sorted(final)}')
          print('final tree PASS')
          PY
          git commit -m 'Finalize APMS Dashboard Exit Closure'
          git push origin HEAD:agent/apms-dashboard-final-exit-closure
