name: Device Health Gateway Policy Dashboard Validation

on:
  push:
    branches:
      - agent/device-health-gateway-policy-dashboard

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Gateway monitoring contract tests
        run: node --test src/pages/locks/gatewayMonitoring.contract.test.js
      - name: Lint changed lock surfaces
        run: npx eslint src/pages/locks/LocksPage.tsx src/pages/lock-detail/LockDetailPage.tsx
      - name: Build dashboard
        run: npm run build
