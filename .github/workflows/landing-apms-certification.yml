name: Landing APMS Certification

on:
  pull_request:
    paths:
      - "src/pages/LandingPage.tsx"
      - "src/pages/LandingPage.css"
      - "src/pages/LandingPage.apms.contract.test.mjs"
      - "src/components/OnboardingBookingModal.tsx"
      - "src/branding/BrandProvider.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/landing-apms-certification.yml"
  push:
    branches:
      - main
    paths:
      - "src/pages/LandingPage.tsx"
      - "src/pages/LandingPage.css"
      - "src/pages/LandingPage.apms.contract.test.mjs"
      - "src/components/OnboardingBookingModal.tsx"
      - "src/branding/BrandProvider.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/landing-apms-certification.yml"

permissions:
  contents: read

jobs:
  certify-landing-apms:
    name: Contract, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify APMS landing contracts
        run: npm run test:landing-apms

      - name: Lint landing surface
        run: >-
          npx eslint
          src/pages/LandingPage.tsx
          src/components/OnboardingBookingModal.tsx
          src/branding/BrandProvider.tsx

      - name: Build production bundle
        run: npm run build
