name: Temporary Dashboard Postal Code Safe Patch

on:
  push:
    branches:
      - agent/airbnb-auto-matching-v1-1-postal-details-safe
    paths:
      - '.github/workflows/tmp-dashboard-postal-code-safe.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact safe branch
        uses: actions/checkout@v4
        with:
          ref: agent/airbnb-auto-matching-v1-1-postal-details-safe
          fetch-depth: 0

      - name: Apply deterministic postal-code patch
        run: python .github/scripts/tmp_dashboard_postal_code.py

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run postal-code contract
        run: node --test src/pages/properties/PropertyPostalCode.contract.test.js

      - name: Type-check dashboard
        run: npx tsc -b --noEmit

      - name: Build dashboard
        run: npm run build

      - name: Prove exact narrow diff
        shell: bash
        run: |
          git diff --check
          git diff --name-only f932bdda5c7ebcaf10becf43df9dd3b967a59809 -- \
            src/api/properties.ts \
            src/pages/onboarding/CreatePropertyPage.tsx \
            src/pages/properties/PropertyEditPage.tsx \
            src/pages/properties/PropertyPostalCode.contract.test.js
          test "$(git diff --name-only f932bdda5c7ebcaf10becf43df9dd3b967a59809 -- src/api/properties.ts src/pages/onboarding/CreatePropertyPage.tsx src/pages/properties/PropertyEditPage.tsx src/pages/properties/PropertyPostalCode.contract.test.js | wc -l | tr -d ' ')" = "4"
          grep -F 'componentValue("postal_code")' src/pages/onboarding/CreatePropertyPage.tsx
          grep -F 'postalCode: form.postalCode' src/pages/properties/PropertyEditPage.tsx
          ! grep -R -E '/mappings|/activate|load_future_reservations' \
            src/api/properties.ts \
            src/pages/onboarding/CreatePropertyPage.tsx \
            src/pages/properties/PropertyEditPage.tsx

      - name: Commit certified dashboard implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/tmp_dashboard_postal_code.py
          git add \
            src/api/properties.ts \
            src/pages/onboarding/CreatePropertyPage.tsx \
            src/pages/properties/PropertyEditPage.tsx \
            src/pages/properties/PropertyPostalCode.contract.test.js
          git diff --cached --check
          git commit -m 'Add property postal code capture'
          git push origin HEAD:agent/airbnb-auto-matching-v1-1-postal-details-safe
