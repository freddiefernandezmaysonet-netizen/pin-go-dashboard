name: Property Protection V1 Dashboard Certification

on:
  pull_request:
    paths:
      - "src/pages/reservation-detail/ReservationDetailPage.tsx"
      - "src/pages/reservation-detail/ReservationDetailDamageCase.contract.test.ts"
      - "src/pages/public-booking/GuestCancellationPage.tsx"
      - "src/pages/public-booking/GuestManagePropertyProtection.contract.test.ts"
      - "src/pages/public-booking/GuestDamagePaymentAuthorization.tsx"
      - "src/pages/public-booking/GuestDamagePaymentAuthorization.runtime.test.mjs"
      - "src/pages/public-booking/PublicPropertyDetailPage.tsx"
      - "src/pages/public-booking/PublicPropertyProtection.contract.test.ts"
      - ".github/workflows/property-protection-v1-dashboard-certification.yml"

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Certify non-charging Damage Case UX
        run: node --experimental-strip-types --test src/pages/reservation-detail/ReservationDetailDamageCase.contract.test.ts

      - name: Certify Manage Reservation Damage Case presentation
        run: node --experimental-strip-types --test src/pages/public-booking/GuestManagePropertyProtection.contract.test.ts

      - name: Build dashboard
        run: npm run build

      - name: Check explicit guest authorization component
        run: |
          ./node_modules/.bin/eslint src/pages/public-booking/GuestDamagePaymentAuthorization.tsx
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck --jsx react-jsx --module esnext --moduleResolution bundler --target es2022 src/pages/public-booking/GuestDamagePaymentAuthorization.tsx

      - name: Exercise authorization UX with synthetic responses only
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/damage-renderer" react@19.2.4 react-test-renderer@19.2.4
          PINGO_REACT_TEST_PACKAGE="$RUNNER_TEMP/damage-renderer/package.json" node --test src/pages/public-booking/GuestDamagePaymentAuthorization.runtime.test.mjs

      - name: Certify public Property Protection disclosure
        run: node --experimental-strip-types --test src/pages/public-booking/PublicPropertyProtection.contract.test.ts
