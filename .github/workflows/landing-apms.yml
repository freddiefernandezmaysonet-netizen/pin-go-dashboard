name: APMS Landing
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/Landing*'
      - 'src/components/HaasConfigurator.tsx'
      - 'public/locks/**'
      - 'public/channels/**'
      - 'tests/landing.browser.mjs'
      - '.github/workflows/landing-apms.yml'
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx eslint src/pages/LandingPage.tsx src/pages/LandingContent.tsx src/components/HaasConfigurator.tsx
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/pages/LandingPage.tsx
      - run: npm run build
      - run: npm install --prefix /tmp/landing-playwright --no-audit --no-fund playwright@1.58.2
      - run: node /tmp/landing-playwright/node_modules/playwright/cli.js install chromium --only-shell
      - run: node tests/landing.browser.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/landing-playwright/node_modules/playwright/index.mjs
          LANDING_TEST_OUTPUT: /tmp/landing-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-screenshots
          path: /tmp/landing-browser
