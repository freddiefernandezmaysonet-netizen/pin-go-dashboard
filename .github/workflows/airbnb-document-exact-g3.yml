name: Airbnb Document-Exact Gate 3 (dashboard)

on:
  push:
    branches:
      - agent/airbnb-document-exact-closure

permissions:
  contents: read

jobs:
  listing-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact working branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run mocked client contracts and callback discovery component
        run: node --test src/api/distribution.contract.test.js src/pages/distribution/AirbnbConnectionCallbackPage.test.js
      - name: Build static dashboard without deployment
        run: npm run build
      - name: Prove authentication router frame policy and branch deployment veto unchanged
        run: git diff --exit-code 23630d2c0af539f9e1e2427e1d8bbddfefa67ccd -- src/auth src/app/routes/router.tsx src/lib/distributionFramePolicy.ts src/pages/distribution/ConnectionCenterPage.tsx vercel.json
