name: Host calendar
on:
  pull_request:
    branches: [main]
    paths: ['src/calendar/**', 'src/pages/calendar/**', 'src/pages/properties/PropertyCalendarPage.tsx', 'src/components/properties/PropertyCalendarStayRestrictionsPanel.tsx', 'src/app/routes/router.tsx', '.github/workflows/host-calendar.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test src/pages/calendar/HostCalendar.interaction.test.mjs src/pages/properties/PropertyCalendarMissionControl.contract.test.mjs
      - run: npm run build
