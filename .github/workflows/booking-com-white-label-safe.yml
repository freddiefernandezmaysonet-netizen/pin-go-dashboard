name: Booking.com White Label Validation (dashboard)

on:
  push:
    branches:
      - agent/booking-com-white-label-safe

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: booking-com-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE: http://127.0.0.1:4173
      BASELINE_SHA: 8b3e210eefb44f02553a86a2b6fabc3a860fb9b9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify isolated branch and explicit file scope
        run: |
          mkdir -p evidence
          test "$GITHUB_REF_NAME" = agent/booking-com-white-label-safe
          git diff --name-only "$BASELINE_SHA" HEAD | tee evidence/changed-files.txt
          git diff --exit-code "$BASELINE_SHA" HEAD -- . ':(exclude)src/pages/distribution/ConnectionCenterPage.tsx' ':(exclude)src/pages/distribution/BookingComConnectionFlow.test.js' ':(exclude)vercel.json' ':(exclude).github/workflows/booking-com-white-label-safe.yml' ':(exclude).github/scripts/booking-com-browser-check.py'
          node -e 'const c=require("./vercel.json"); if(c.git?.deploymentEnabled?.["agent/booking-com-white-label-safe"]!==false) process.exit(1)'
          git diff "$BASELINE_SHA" HEAD > evidence/candidate.patch
          git rev-parse HEAD > evidence/candidate-sha.txt
      - name: Install unchanged locked dependencies without lifecycle scripts
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/install.txt
      - name: Preserve existing Airbnb source functions byte for byte
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS' | tee evidence/airbnb-source-freeze.txt
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import ts from 'typescript';
          const path='src/pages/distribution/ConnectionCenterPage.tsx';
          const before=execFileSync('git',['show',`${process.env.BASELINE_SHA}:${path}`],{encoding:'utf8'});
          const after=readFileSync(path,'utf8');
          function functions(text) {
            const ast=ts.createSourceFile(path,text,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
            const found=new Map();
            function visit(n) { if(ts.isFunctionDeclaration(n)&&n.name) found.set(n.name.text,n.getText(ast)); ts.forEachChild(n,visit); }
            visit(ast); return found;
          }
          const a=functions(before),b=functions(after);
          for(const name of ['isAirbnbListingDiscoveryEligible','AirbnbListingsPanel','listingMeta','reviewReasonMessages','confirmAirbnbCandidate']) {
            assert.equal(b.get(name),a.get(name),`Out-of-scope change: ${name}`);
            console.log(`${name}: unchanged`);
          }
          JS
      - name: Run new Booking.com behavior tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test src/pages/distribution/BookingComConnectionFlow.test.js 2>&1 | tee evidence/booking-tests.txt
      - name: Run the complete existing connection regression set without hiding failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test src/api/distribution.contract.test.js src/api/distribution.channel-linked.contract.test.js src/api/airbnbHostSelfService.test.js src/pages/distribution/*.test.js 2>&1 | tee evidence/tests.txt
      - name: Compare the same regressions and static checks with unchanged main
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: comparison
        run: |
          git worktree add --detach "$RUNNER_TEMP/booking-baseline" "$BASELINE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/booking-baseline/node_modules"
          set +e
          (cd "$RUNNER_TEMP/booking-baseline" && node --test src/api/distribution.contract.test.js src/api/distribution.channel-linked.contract.test.js src/api/airbnbHostSelfService.test.js src/pages/distribution/*.test.js) > evidence/tests-baseline.txt 2>&1
          baseline_tests=$?
          ./node_modules/.bin/tsc -p tsconfig.app.json --noEmit --pretty false > evidence/types-candidate.txt 2>&1
          candidate_types=$?
          (cd "$RUNNER_TEMP/booking-baseline" && ./node_modules/.bin/tsc -p tsconfig.app.json --noEmit --pretty false) > evidence/types-baseline.txt 2>&1
          baseline_types=$?
          ./node_modules/.bin/eslint src/pages/distribution/ConnectionCenterPage.tsx --format json > evidence/lint-candidate.json 2>&1
          candidate_lint=$?
          (cd "$RUNNER_TEMP/booking-baseline" && ./node_modules/.bin/eslint src/pages/distribution/ConnectionCenterPage.tsx --format json) > evidence/lint-baseline.json 2>&1
          baseline_lint=$?
          printf 'baseline_tests=%s\nbaseline_types=%s\ncandidate_types=%s\nbaseline_lint=%s\ncandidate_lint=%s\n' "$baseline_tests" "$baseline_types" "$candidate_types" "$baseline_lint" "$candidate_lint" | tee evidence/static-check-status.txt
          set -e
          python3 <<'PY'
          import json,re
          from pathlib import Path
          p=Path('evidence')
          failures=lambda name:sorted(re.findall(r'^not ok \d+ - (.+)$',(p/name).read_text(),re.M))
          baseline=failures('tests-baseline.txt');candidate=failures('tests.txt')
          tb=(p/'types-baseline.txt').read_text();tc=(p/'types-candidate.txt').read_text()
          result={'baselineFailedTests':baseline,'candidateFailedTests':candidate,'sameFailedTests':baseline==candidate,'sameTypeDiagnostics':tb==tc,'baselineTypeCount':len(re.findall('error TS',tb)),'candidateTypeCount':len(re.findall('error TS',tc))}
          (p/'baseline-comparison.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          assert baseline==candidate,'New regression failures'
          assert tb==tc,'Changed TypeScript diagnostics'
          PY
      - name: Build the full dashboard with local-only API base
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: build
        run: npm run build 2>&1 | tee evidence/build.txt
      - name: Build unchanged main for mobile layout comparison
        if: ${{ !cancelled() && steps.comparison.outcome == 'success' }}
        run: cd "$RUNNER_TEMP/booking-baseline" && npm run build 2>&1 | tee "$GITHUB_WORKSPACE/evidence/build-baseline.txt"
      - name: Prepare browser tools outside project dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: browser_tools
        run: |
          npm install --prefix "$RUNNER_TEMP/booking-browser-tools" --no-audit --no-fund agent-browser@0.27.0
          python3 -m venv "$RUNNER_TEMP/booking-browser-python"
          "$RUNNER_TEMP/booking-browser-python/bin/pip" install playwright==1.57.0
          npm ls --prefix "$RUNNER_TEMP/booking-browser-tools" --depth=0 > evidence/browser-tool-versions.txt
          "$RUNNER_TEMP/booking-browser-python/bin/pip" freeze >> evidence/browser-tool-versions.txt
      - name: Verify compiled dashboard in browser with only synthetic local responses
        if: ${{ !cancelled() && steps.browser_tools.outcome == 'success' }}
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          export AGENT_BROWSER_BIN="$RUNNER_TEMP/booking-browser-tools/node_modules/.bin/agent-browser"
          export BASELINE_DIR="$RUNNER_TEMP/booking-baseline"
          "$RUNNER_TEMP/booking-browser-python/bin/python" .github/scripts/booking-com-browser-check.py 2>&1 | tee evidence/browser-run.txt
      - name: Preserve exact source and unchanged dependency evidence
        if: ${{ !cancelled() }}
        run: |
          git archive --format=tar HEAD src public index.html package.json package-lock.json tsconfig.json tsconfig.app.json tsconfig.node.json vercel.json .github/workflows/booking-com-white-label-safe.yml .github/scripts/booking-com-browser-check.py > evidence/source.tar
          if test -d dist; then tar -czf evidence/compiled-dashboard.tar.gz dist; fi
          git diff --exit-code -- package.json package-lock.json
      - name: Preserve all results including failed checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: booking-com-dashboard-validation
          path: evidence/
          retention-days: 7
          if-no-files-found: error

  full-types:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Keep full application TypeScript validation explicit
        run: ./node_modules/.bin/tsc -p tsconfig.app.json --noEmit --pretty false
