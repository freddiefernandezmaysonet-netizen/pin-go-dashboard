name: Public booking payment confirmation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/public-booking/PublicBookingSuccessPage.tsx'
      - 'src/pages/public-booking/useCheckoutConfirmation.ts'
      - 'src/pages/public-booking/bookingConfirmation.interaction.test.mjs'
      - 'src/pages/public-booking/GuestStayGuide.tsx'
      - '.github/workflows/public-booking-confirmation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test src/pages/public-booking/bookingConfirmation.interaction.test.mjs src/pages/public-booking/guestStayGuide.interaction.test.mjs
      - run: npx tsc -b --pretty false
      - run: npm run build
