name: Precheckin campaign card
on:
  pull_request:
    paths:
      - 'src/components/dashboard/PrecheckinCampaignCard*'
      - 'src/pages/overview/OverviewPage.tsx'
      - '.github/workflows/precheckin-campaign-card.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test src/components/dashboard/PrecheckinCampaignCard.test.mjs
      - run: npm run build
