name: Demo Center commercial journey UI
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/admin/AdminDemoCenterPage.tsx'
      - 'src/pages/public-booking/GuestCancellationPage.tsx'
      - 'tests/demo-center.browser.mjs'
      - '.github/workflows/demo-center-commercial.yml'
permissions:
  contents: read
jobs:
  demo-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and lint the changed screens
        run: |
          npx --no-install tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/pages/admin/AdminDemoCenterPage.tsx src/pages/public-booking/GuestCancellationPage.tsx
          npx --no-install eslint src/pages/admin/AdminDemoCenterPage.tsx src/pages/public-booking/GuestCancellationPage.tsx
      - run: npm run build
      - name: Install isolated browser test dependency
        run: npm install --ignore-scripts --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
      - run: npx --no-install playwright install --with-deps chromium
      - name: Actual React screens with synthetic API responses
        run: node tests/demo-center.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-center-browser-evidence
          path: test-artifacts/demo-center
          if-no-files-found: warn
