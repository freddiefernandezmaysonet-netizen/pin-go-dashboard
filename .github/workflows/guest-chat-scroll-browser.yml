name: Guest Chat Scroll Browser
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/public-booking/GuestPinAIChat.tsx"
      - "src/pages/public-booking/pinAIChatSession.ts"
      - "tests/guest-chat-scroll.browser.mjs"
      - ".github/workflows/guest-chat-scroll-browser.yml"
permissions:
  contents: read
jobs:
  scrolling:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/chat-browser-tools" --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Verify scrolling with synthetic guest messages
        run: |
          export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/chat-browser-tools/node_modules/playwright/index.mjs"
          test -n "$CHROMIUM_EXECUTABLE_PATH"
          node tests/guest-chat-scroll.browser.mjs
