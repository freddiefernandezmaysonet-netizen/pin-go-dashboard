name: Stripe Connect Isolation V2 Dashboard Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/api/payouts.ts"
      - "src/components/payouts/StripeConnectIsolationV2Card.tsx"
      - "src/components/payouts/HostPayoutsExperience.tsx"
      - "src/components/payouts/stripe-connect-isolation-v2.contract.test.mjs"
      - "src/components/payouts/host-payouts-experience.runtime.test.mjs"
      - "src/app/routes/router.tsx"
      - "vercel.json"
      - ".github/workflows/stripe-connect-isolation-v2-dashboard-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Isolation V2 dashboard contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Run Isolation V2 dashboard contracts
        run: node --test src/components/payouts/stripe-connect-isolation-v2.contract.test.mjs

      - name: Build dashboard
        run: npm run build

      - name: Test payout experience with mocked API and Stripe surface
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/payouts-renderer" react@19.2.4 react-test-renderer@19.2.4
          PINGO_REACT_TEST_PACKAGE="$RUNNER_TEMP/payouts-renderer/package.json" node --test src/components/payouts/host-payouts-experience.runtime.test.mjs

      - name: Certify safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'connect-isolation-v2/eligibility' src/api/payouts.ts
          grep -q 'getStripeConnectV2Eligibility' src/components/payouts/HostPayoutsExperience.tsx
          grep -q 'eligibility.accountCreationAllowed' src/components/payouts/HostPayoutsExperience.tsx
          grep -q 'accountCreationAllowed: boolean' src/components/payouts/StripeConnectIsolationV2Card.tsx
          ! grep -q 'VITE_STRIPE_CONNECT_ISOLATION_V2_ENABLED' src/components/payouts/HostPayoutsExperience.tsx
          ! grep -q 'VITE_STRIPE_CONNECT_V2_ACCOUNT_CREATION_ENABLED' src/components/payouts/HostPayoutsExperience.tsx
          ! grep -q 'VITE_STRIPE_CONNECT_ISOLATION_V2_ENABLED' src/components/payouts/StripeConnectIsolationV2Card.tsx
          ! grep -q 'VITE_STRIPE_CONNECT_V2_ACCOUNT_CREATION_ENABLED' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'connect-isolation-v2/account' src/api/payouts.ts
          grep -q 'connect-isolation-v2/account-session' src/api/payouts.ts
          grep -q 'syncHostPayoutStatus' src/components/payouts/StripeConnectIsolationV2Card.tsx
          ! grep -q 'getHostPayoutStatus' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'account-onboarding' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'account-management' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'notification-banner' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'documents' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'instance.create(name)' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'if (!status.detailsSubmitted)' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'mount(instance, "account-onboarding"' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'return;' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'mount(instance, "notification-banner"' src/components/payouts/StripeConnectIsolationV2Card.tsx
          grep -q 'https://connect-js.stripe.com' vercel.json
          grep -q 'https://js.stripe.com' vercel.json
          grep -q 'https://app.channex.io' vercel.json
          grep -q 'https://staging.channex.io' vercel.json
          grep -q 'HostPayoutsExperience' src/app/routes/router.tsx
          ! grep -q 'createHostPayoutDashboardLoginLink' src/components/payouts/StripeConnectIsolationV2Card.tsx
          ! grep -q 'window.location' src/components/payouts/StripeConnectIsolationV2Card.tsx
