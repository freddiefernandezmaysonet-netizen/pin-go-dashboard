name: Staff Members Enterprise Layout
on:
  pull_request:
    paths:
      - "src/pages/staff/StaffMembersPage.tsx"
      - "src/pages/staff/StaffMembersPage.enterprise-layout.contract.test.js"
      - ".github/workflows/staff-members-enterprise-layout.yml"
permissions:
  contents: read
jobs:
  contract-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test src/pages/staff/StaffMembersPage.cleaning-timing.contract.test.js src/pages/staff/StaffMembersPage.enterprise-layout.contract.test.js
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
