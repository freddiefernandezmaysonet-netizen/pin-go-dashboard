name: Property Calendar Responsive Certification
on:
  push:
    branches: [agent/property-calendar-responsive-v1]
  pull_request:
    branches: [main]
    paths:
      - 'src/pages/properties/PropertyCalendar*'
      - 'src/components/properties/PropertyCalendarStayRestrictionsPanel*'
      - 'src/components/properties/OperationalIntelligencePanel.tsx'
      - 'src/app/routes/router.tsx'
      - '.github/scripts/calendar-responsive-browser.py'
      - '.github/workflows/property-calendar-responsive.yml'
      - 'vercel.json'
permissions:
  contents: read
concurrency:
  group: property-calendar-responsive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify isolated branch deployment guard
        run: |
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const c=JSON.parse(fs.readFileSync('vercel.json','utf8'));assert.equal(c.git.deploymentEnabled['agent/property-calendar-responsive-v1'],false);assert.notEqual(c.git.deploymentEnabled.main,false);"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile unmodified production baseline without publishing
        run: |
          git worktree add --detach "$RUNNER_TEMP/calendar-baseline" 2e0429911851379065a8819333a3b6a07c0bbcfd
          cd "$RUNNER_TEMP/calendar-baseline"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Apply audited presentation hooks once
        if: github.event_name == 'push' && hashFiles('.github/scripts/calendar-responsive-prepare.mjs') != ''
        run: |
          test "$GITHUB_REF" = refs/heads/agent/property-calendar-responsive-v1
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 2e0429911851379065a8819333a3b6a07c0bbcfd
          node .github/scripts/calendar-responsive-prepare.mjs
      - name: Existing removal, calendar and dashboard regressions (mocked)
        run: >-
          node --test src/components/properties/PropertyCalendarStayRestrictionsPanel.removal.test.mjs
          src/dashboard-typescript-baseline.contract.test.mjs
          src/lib/apmsMissionControlPresentation.test.mjs
          src/lib/apmsMissionControlFreshness.test.mjs
          src/pages/properties/PropertyCalendarMissionControl.contract.test.mjs
      - name: Complete dashboard TypeScript
        run: npx --no-install tsc -p tsconfig.app.json --noEmit
      - name: Production bundle only, no deployment
        run: npm run build
      - name: Install isolated browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/calendar-browser-tools" --no-audit --no-fund agent-browser@0.27.0
          python3 -m venv "$RUNNER_TEMP/calendar-browser-python"
          "$RUNNER_TEMP/calendar-browser-python/bin/pip" install playwright==1.57.0
          "$RUNNER_TEMP/calendar-browser-python/bin/playwright" install --with-deps chromium webkit
          echo "AGENT_BROWSER_BIN=$RUNNER_TEMP/calendar-browser-tools/node_modules/.bin/agent-browser" >> "$GITHUB_ENV"
          echo "BASELINE_DIST=$RUNNER_TEMP/calendar-baseline/dist" >> "$GITHUB_ENV"
      - name: Full route in Chromium and iPhone WebKit emulation, local fixtures only
        run: '"$RUNNER_TEMP/calendar-browser-python/bin/python" .github/scripts/calendar-responsive-browser.py'
      - name: Preserve screenshots and acceptance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-responsive-${{ github.run_id }}
          path: evidence/calendar-responsive
          if-no-files-found: ignore
          retention-days: 14
      - name: Validate exact preparation scope and whitespace
        if: github.event_name == 'push' && hashFiles('.github/scripts/calendar-responsive-prepare.mjs') != ''
        run: |
          git diff --check
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const expected=['src/pages/properties/PropertyCalendarPage.tsx','src/components/properties/OperationalIntelligencePanel.tsx','src/components/properties/PropertyCalendarStayRestrictionsPanel.tsx','src/app/routes/router.tsx','src/pages/properties/PropertyCalendarMissionControl.contract.test.mjs'].sort();
          assert.deepEqual(execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').sort(),expected);
          JS
      - name: Publish only validated UI changes to the isolated branch and remove preparation script
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/property-calendar-responsive-v1' && hashFiles('.github/scripts/calendar-responsive-prepare.mjs') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            const args = {...context.repo};
            const branch = 'agent/property-calendar-responsive-v1';
            assert.equal(args.owner,'freddiefernandezmaysonet-netizen');
            assert.equal(args.repo,'pin-go-dashboard');
            const main = await github.rest.git.getRef({...args,ref:'heads/main'});
            assert.equal(main.data.object.sha,'2e0429911851379065a8819333a3b6a07c0bbcfd');
            const head = await github.rest.git.getRef({...args,ref:'heads/'+branch});
            assert.equal(head.data.object.sha,context.sha);
            const parent = await github.rest.git.getCommit({...args,commit_sha:context.sha});
            const paths=['src/pages/properties/PropertyCalendarPage.tsx','src/components/properties/OperationalIntelligencePanel.tsx','src/components/properties/PropertyCalendarStayRestrictionsPanel.tsx','src/app/routes/router.tsx','src/pages/properties/PropertyCalendarMissionControl.contract.test.mjs'];
            const tree=[];
            for (const path of paths) {
              const blob=await github.rest.git.createBlob({...args,content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            tree.push({path:'.github/scripts/calendar-responsive-prepare.mjs',mode:'100644',type:'blob',sha:null});
            const result=await github.rest.git.createTree({...args,base_tree:parent.data.tree.sha,tree});
            const commit=await github.rest.git.createCommit({...args,message:'feat: adapt property calendar, restrictions and Mission Control for mobile',tree:result.data.sha,parents:[context.sha]});
            const current=await github.rest.git.getRef({...args,ref:'heads/'+branch});
            assert.equal(current.data.object.sha,context.sha);
            await github.rest.git.updateRef({...args,ref:'heads/'+branch,sha:commit.data.sha,force:false});
            core.info('VALIDATED_RESPONSIVE_COMMIT='+commit.data.sha);
            core.info('No main update, merge, deployment, backend or production data mutation.');
