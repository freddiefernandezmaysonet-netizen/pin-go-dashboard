name: Host Cleaning Visibility
on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/host-cleanings/**"
      - "src/app/routes/router.tsx"
      - "src/app/layout/AppShell.tsx"
      - "src/pages/reservation-detail/ReservationDetailPage.tsx"
      - ".github/workflows/host-cleanings.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test src/pages/host-cleanings/host-cleanings.runtime.test.mjs
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/pages/host-cleanings/HostCleaningsPage.tsx
      - run: npx eslint src/pages/host-cleanings/HostCleaningsPage.tsx src/app/layout/AppShell.tsx src/app/routes/router.tsx
      - run: npm run build
