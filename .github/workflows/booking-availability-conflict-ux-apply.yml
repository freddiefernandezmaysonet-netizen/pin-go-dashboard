name: Temporary Booking Availability Conflict UX Apply

on:
  push:
    branches:
      - agent/booking-availability-conflict-ux
    paths:
      - ".github/workflows/booking-availability-conflict-ux-apply.yml"

permissions:
  contents: write

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/booking-availability-conflict-ux
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply anchored availability conflict UX patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/public-booking/PublicPropertyDetailPage.tsx")
          text = path.read_text()

          old_blocked = '''useEffect(() => {
  if (!property?.id) return;

  let active = true;

  async function loadBlockedDates() {
    try {
      const today = new Date();
      const from = toDateInputValue(today);
      const to = toDateInputValue(addDays(today, 365));

      const res = await fetch(`${API_BASE}/api/public-booking/blocked-dates`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          propertyId: property?.id,
          from,
          to,
        }),
      });

      const data = await res.json();

      if (!active) return;

      if (!res.ok || !data.ok) {
        setBlockedDates([]);
        return;
      }

      setBlockedDates(Array.isArray(data.blockedDates) ? data.blockedDates : []);
    } catch (err) {
  console.error("[blocked dates frontend error]", err);
  if (active) {
    setBlockedDates([]);
  }
}

  }

  loadBlockedDates();

  return () => {
    active = false;
  };
}, [property?.id]);'''

          new_blocked = '''const refreshBlockedDates = useCallback(async () => {
  if (!property?.id) {
    setBlockedDates([]);
    return;
  }

  try {
    const today = new Date();
    const from = toDateInputValue(today);
    const to = toDateInputValue(addDays(today, 365));

    const res = await fetch(`${API_BASE}/api/public-booking/blocked-dates`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        propertyId: property.id,
        from,
        to,
      }),
    });

    const data = await res.json();

    if (!res.ok || !data.ok) {
      setBlockedDates([]);
      return;
    }

    setBlockedDates(Array.isArray(data.blockedDates) ? data.blockedDates : []);
  } catch (err) {
    console.error("[blocked dates frontend error]", err);
    setBlockedDates([]);
  }
}, [property?.id]);

useEffect(() => {
  void refreshBlockedDates();
}, [refreshBlockedDates]);'''

          if text.count(old_blocked) != 1:
            raise SystemExit(f"blocked dates anchor count={text.count(old_blocked)}")
          text = text.replace(old_blocked, new_blocked, 1)

          old_checkout = '''      const data = await res.json();

      if (!res.ok || !data.ok || !data.checkoutUrl) {
        throw new Error(
          data.error || copy.unableToCreateCheckout
        );
      }
      window.location.href = data.checkoutUrl;'''

          new_checkout = '''      const data = await res.json();

      if (
        res.status === 409 &&
        data?.error === "Property is not available for the selected dates"
      ) {
        setPricing(null);
        await refreshBlockedDates();
        setBookingError(
          preferredLanguage === "es"
            ? "Estas fechas acaban de dejar de estar disponibles. Selecciona otras fechas para continuar."
            : "These dates just became unavailable. Select different dates to continue."
        );
        window.setTimeout(() => {
          document.getElementById("pbe-booking-title")?.scrollIntoView({
            behavior: "smooth",
            block: "start",
          });
        }, 0);
        return;
      }

      if (!res.ok || !data.ok || !data.checkoutUrl) {
        throw new Error(
          data.error || copy.unableToCreateCheckout
        );
      }
      window.location.href = data.checkoutUrl;'''

          if text.count(old_checkout) != 1:
            raise SystemExit(f"checkout anchor count={text.count(old_checkout)}")
          text = text.replace(old_checkout, new_checkout, 1)

          path.write_text(text)
          PY

      - name: Verify integration markers
        run: |
          grep -F 'const refreshBlockedDates = useCallback(async () =>' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'res.status === 409' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'Estas fechas acaban de dejar de estar disponibles.' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'These dates just became unavailable.' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'document.getElementById("pbe-booking-title")?.scrollIntoView' src/pages/public-booking/PublicPropertyDetailPage.tsx

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

      - name: Commit only Direct Booking UX change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/public-booking/PublicPropertyDetailPage.tsx
          test -n "$(git status --porcelain src/pages/public-booking/PublicPropertyDetailPage.tsx)"
          git commit -m "Handle stale booking availability gracefully"
          git push origin HEAD:agent/booking-availability-conflict-ux
