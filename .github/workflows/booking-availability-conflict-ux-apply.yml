name: Temporary Booking Availability Conflict UX Apply

on:
  push:
    branches:
      - agent/booking-availability-conflict-ux
    paths:
      - ".github/workflows/booking-availability-conflict-ux-apply.yml"
      - ".github/scripts/apply_booking_availability_conflict_ux.py"

permissions:
  contents: write

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/booking-availability-conflict-ux
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply anchored availability conflict UX patch
        run: python .github/scripts/apply_booking_availability_conflict_ux.py

      - name: Verify integration markers
        run: |
          grep -F 'const refreshBlockedDates = useCallback(async () =>' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'res.status === 409' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'Estas fechas acaban de dejar de estar disponibles.' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'These dates just became unavailable.' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'document.getElementById("pbe-booking-title")?.scrollIntoView' src/pages/public-booking/PublicPropertyDetailPage.tsx

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

      - name: Commit only Direct Booking UX change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/public-booking/PublicPropertyDetailPage.tsx
          test -n "$(git status --porcelain src/pages/public-booking/PublicPropertyDetailPage.tsx)"
          git commit -m "Handle stale booking availability gracefully"
          git push origin HEAD:agent/booking-availability-conflict-ux
