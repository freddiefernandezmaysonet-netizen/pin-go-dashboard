name: Prepare isolated Mission Control dashboard patch
on:
  push:
    branches: ['agent/mission-control-e13-decoupling-v1']
    paths: ['.github/scripts/prepare-mission-control-e13.mjs', '.github/scripts/prepare-dashboard-baseline.mjs', '.github/workflows/prepare-mission-control-e13.yml']
permissions:
  contents: read
concurrency:
  group: prepare-mission-control-e13-dashboard
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'freddiefernandezmaysonet-netizen/pin-go-dashboard' && github.ref == 'refs/heads/agent/mission-control-e13-decoupling-v1' && contains(github.event.head_commit.message, '[prepare-e13]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BASE_SHA: 5f4a65d718e3678474544966e1857e78caeca05d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require audited baseline and no-deploy guard
        run: |
          test "$(git rev-parse HEAD^)" = '3176d514e522db870cf6249f0e9df1c2c551f3e4'
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/agent/mission-control-e13-decoupling-v1 | cut -f1)" = "$GITHUB_SHA"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const before = JSON.parse(execFileSync('git',['show',process.env.BASE_SHA+':vercel.json'],{encoding:'utf8'}));
          const current = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          assert.equal(current.git.deploymentEnabled['agent/mission-control-e13-decoupling-v1'],false);
          delete current.git.deploymentEnabled['agent/mission-control-e13-decoupling-v1'];
          assert.deepEqual(current,before);
          JS
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply four authorized corrections, one file at a time
        run: node .github/scripts/prepare-dashboard-baseline.mjs
      - name: Certify corrected baseline BEFORE changing the calendar
        run: |
          node --test src/dashboard-typescript-baseline.contract.test.mjs src/lib/apmsMissionControlPresentation.test.mjs src/lib/apmsMissionControlFreshness.test.mjs
          npx --no-install tsc -p tsconfig.app.json --noEmit
          npm run build
      - name: Apply previously authorized page edit only after baseline passes
        run: node .github/scripts/prepare-mission-control-e13.mjs
      - name: Validate actual component render and full Dashboard build
        run: |
          node --test src/dashboard-typescript-baseline.contract.test.mjs src/lib/apmsMissionControlPresentation.test.mjs src/lib/apmsMissionControlFreshness.test.mjs src/pages/properties/PropertyCalendarMissionControl.contract.test.mjs
          npx --no-install tsc -p tsconfig.app.json --noEmit
          npm run build
          git diff --check
      - name: Remove temporary preparers and verify exact authorized final scope
        run: |
          git rm -- .github/scripts/prepare-mission-control-e13.mjs .github/scripts/prepare-dashboard-baseline.mjs .github/workflows/prepare-mission-control-e13.yml
          git add -- src/auth/AuthProvider.tsx src/pages/staff/StaffMembersPage.tsx src/components/reviews/PublicReviewsSection.tsx src/api/distribution.ts src/pages/properties/PropertyCalendarPage.tsx
          git diff --name-only "$BASE_SHA" | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          .github/workflows/mission-control-observational-certification.yml
          src/api/distribution.ts
          src/auth/AuthProvider.tsx
          src/components/reviews/PublicReviewsSection.tsx
          src/dashboard-typescript-baseline.contract.test.mjs
          src/pages/properties/PropertyCalendarMissionControl.contract.test.mjs
          src/pages/properties/PropertyCalendarPage.tsx
          src/pages/staff/StaffMembersPage.tsx
          vercel.json
          EOF
          sort "$RUNNER_TEMP/allowed.txt" -o "$RUNNER_TEMP/allowed.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          git diff --exit-code "$BASE_SHA" -- src/api/auth.ts src/app src/lib src/pages/ApmsDecisionHistoryPage.tsx package.json package-lock.json tsconfig.app.json
          git diff --cached --check
      - name: Export tested blobs for connector publication; never update a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='freddiefernandezmaysonet-netizen/pin-go-dashboard'
          assert os.environ['GITHUB_REF']=='refs/heads/agent/mission-control-e13-decoupling-v1'
          endpoint='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          manifest=[]
          for path in pathlib.Path(os.environ['RUNNER_TEMP'],'allowed.txt').read_text().splitlines():
              body=json.dumps({'content':base64.b64encode(pathlib.Path(path).read_bytes()).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request(endpoint,data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  sha=json.load(response)['sha']
              assert sha==subprocess.check_output(['git','hash-object',path],text=True).strip()
              manifest.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          print('VERIFIED_PARENT_SHA='+os.environ['GITHUB_SHA'])
          print('VERIFIED_BLOBS='+json.dumps(manifest))
          PY
