name: Airbnb Property Matching + Host Activation Certification

on:
  push:
    branches:
      - agent/airbnb-host-confirmed-mapping-ui-safe
  pull_request:
    branches:
      - main
    paths:
      - 'src/api/airbnbHostSelfService.test.js'
      - 'src/api/airbnbHostSelfService.ts'
      - 'src/api/distribution.channel-linked.contract.test.js'
      - 'src/pages/distribution/AirbnbActivationPanel.test.js'
      - 'src/pages/distribution/AirbnbActivationPanel.tsx'
      - 'src/pages/distribution/AirbnbAutomaticListingDiscovery.contract.test.js'
      - 'src/pages/distribution/ConnectionCenterPage.tsx'
      - '.github/workflows/airbnb-automatic-listing-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  airbnb-property-matching-and-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Airbnb mapping and host-activation contracts
        run: |
          node --test \
            src/api/airbnbHostSelfService.test.js \
            src/api/distribution.channel-linked.contract.test.js \
            src/pages/distribution/AirbnbActivationPanel.test.js \
            src/pages/distribution/AirbnbAutomaticListingDiscovery.contract.test.js

      - name: Build dashboard without deployment
        run: npm run build

      - name: Prove authorized diff allowlist
        shell: bash
        run: |
          head_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$head_branch" = "agent/booking-com-integrated-closure" ]; then
            python3 .github/scripts/verify-booking-com-integrated-scope.py
            exit 0
          fi
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | sort > "$RUNNER_TEMP/actual.txt"
          if [ "$head_branch" = "agent/booking-com-auto-reconcile" ]; then
            cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          .github/scripts/booking-com-auto-reconcile-browser.py
          .github/scripts/booking-com-responsive.contract.test.mjs
          .github/workflows/airbnb-automatic-listing-discovery.yml
          .github/workflows/booking-com-auto-reconcile.yml
          src/api/distribution.contract.test.js
          src/pages/distribution/BookingComConnectionFlow.test.js
          src/pages/distribution/ConnectionCenterPage.enterprise-surface.contract.test.js
          src/pages/distribution/ConnectionCenterPage.tsx
          vercel.json
          EOF
            sort "$RUNNER_TEMP/allowed.txt" -o "$RUNNER_TEMP/allowed.txt"
            diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
            exit 0
          fi
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          .github/workflows/airbnb-automatic-listing-discovery.yml
          src/api/airbnbHostSelfService.test.js
          src/api/airbnbHostSelfService.ts
          src/api/distribution.channel-linked.contract.test.js
          src/pages/distribution/AirbnbActivationPanel.test.js
          src/pages/distribution/AirbnbActivationPanel.tsx
          src/pages/distribution/AirbnbAutomaticListingDiscovery.contract.test.js
          src/pages/distribution/ConnectionCenterPage.tsx
          EOF
          sort "$RUNNER_TEMP/allowed.txt" -o "$RUNNER_TEMP/allowed.txt"
          unexpected="$(comm -23 "$RUNNER_TEMP/actual.txt" "$RUNNER_TEMP/allowed.txt")"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected files outside Airbnb host-mapping surface:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Prove callback router shell and frame policy remain frozen or exactly reviewed
        run: |
          head_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ "$head_branch" = "agent/booking-com-integrated-closure" ]; then
            python3 .github/scripts/verify-booking-com-integrated-scope.py
            node --test .github/scripts/booking-com-responsive.contract.test.mjs
            exit 0
          fi
          if [ "$head_branch" = "agent/booking-com-auto-reconcile" ]; then
            git diff --exit-code origin/main...HEAD -- \
              src/pages/distribution/AirbnbConnectionCallbackPage.tsx \
              src/app/routes/router.tsx \
              src/app/layout/AppShell.tsx \
              src/lib/distributionFramePolicy.ts
            node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const base=JSON.parse(execFileSync('git',['show','origin/main:vercel.json'],{encoding:'utf8'}));
          const current=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          if (current.git?.deploymentEnabled?.['agent/booking-com-auto-reconcile'] !== false) process.exit(1);
          delete current.git.deploymentEnabled['agent/booking-com-auto-reconcile'];
          if (JSON.stringify(current) !== JSON.stringify(base)) process.exit(1);
          NODE
            exit 0
          fi
          git diff --exit-code origin/main...HEAD -- \
            src/pages/distribution/AirbnbConnectionCallbackPage.tsx \
            src/app/routes/router.tsx \
            src/app/layout/AppShell.tsx \
            src/lib/distributionFramePolicy.ts \
            vercel.json

      - name: Prove one discovery read and no polling
        run: |
          test "$(grep -c 'listAirbnbHostListings(id)' src/pages/distribution/ConnectionCenterPage.tsx)" -eq 1
          ! grep -E 'listings\.map\(' src/pages/distribution/ConnectionCenterPage.tsx
          ! grep -E 'setInterval|requestAnimationFrame' src/pages/distribution/ConnectionCenterPage.tsx

      - name: Prove mapping and activation remain separate explicit host actions
        run: |
          sed -n '/function AirbnbListingsPanel/,/function ConnectionFrame/p' \
            src/pages/distribution/ConnectionCenterPage.tsx > "$RUNNER_TEMP/airbnb-mapping-panel.txt"
          grep -F 'Yes, this is my Airbnb property' src/pages/distribution/ConnectionCenterPage.tsx
          grep -F 'CONFIRM_AIRBNB_PROPERTY_MAPPING' src/api/airbnbHostSelfService.ts
          grep -F '/channels/AIRBNB/mapping' src/api/airbnbHostSelfService.ts
          grep -F 'confirmAirbnbHostMapping' src/pages/distribution/ConnectionCenterPage.tsx
          ! grep -E '/activate|activateAirbnbForHost|verifyAirbnbActivationForHost|Activate Airbnb|load_future_reservations' \
            "$RUNNER_TEMP/airbnb-mapping-panel.txt"
          grep -F 'Activate Airbnb' src/pages/distribution/AirbnbActivationPanel.tsx
          grep -F 'activateAirbnbForHost' src/pages/distribution/AirbnbActivationPanel.tsx
          grep -F '/api/dashboard/distribution/properties/${encodeURIComponent(propertyId)}/channels/AIRBNB/activate' \
            src/api/airbnbHostSelfService.ts
          grep -F 'CONFIRM_AIRBNB_ACTIVATION' src/api/airbnbHostSelfService.ts
          grep -F 'verifyAirbnbActivationForHost' src/pages/distribution/AirbnbActivationPanel.tsx
          grep -F '/api/dashboard/distribution/properties/${encodeURIComponent(propertyId)}/channels/AIRBNB/activation/verify' \
            src/api/airbnbHostSelfService.ts
          grep -F 'VERIFY_AIRBNB_ACTIVATION' src/api/airbnbHostSelfService.ts
          ! grep -E 'load_future_reservations|Load reservations' \
            src/api/airbnbHostSelfService.ts \
            src/pages/distribution/ConnectionCenterPage.tsx \
            src/pages/distribution/AirbnbActivationPanel.tsx

      - name: Prove no direct Channex access was introduced
        run: |
          ! grep -E 'app\.channex\.io|staging\.channex\.io|user-api-key' \
            src/api/airbnbHostSelfService.ts \
            src/pages/distribution/ConnectionCenterPage.tsx \
            src/pages/distribution/AirbnbActivationPanel.tsx
