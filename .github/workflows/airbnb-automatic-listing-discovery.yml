name: Airbnb Listing Discovery Status Gate Fix

on:
  push:
    branches:
      - agent/airbnb-listing-discovery-status-gate-fix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  listing-discovery-status-gate:
    if: github.event_name == 'push' || github.head_ref == 'agent/airbnb-listing-discovery-status-gate-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Airbnb listing discovery status-gate contracts
        run: node --test src/pages/distribution/AirbnbAutomaticListingDiscovery.contract.test.js

      - name: Build dashboard without deployment
        run: npm run build

      - name: Prove exact authorized diff allowlist
        run: |
          git diff --name-only a80ed9b40d822b035a7c15af9895e6ac5f915d45...HEAD | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/airbnb-automatic-listing-discovery.yml
          src/pages/distribution/AirbnbAutomaticListingDiscovery.contract.test.js
          src/pages/distribution/ConnectionCenterPage.tsx
          EOF
          sort "$RUNNER_TEMP/expected.txt" -o "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Prove backend-facing client callback router and shell remain frozen
        run: |
          git diff --exit-code a80ed9b40d822b035a7c15af9895e6ac5f915d45 -- \
            src/api \
            src/pages/distribution/AirbnbConnectionCallbackPage.tsx \
            src/app/routes/router.tsx \
            src/app/layout/AppShell.tsx \
            src/lib/distributionFramePolicy.ts \
            vercel.json

      - name: Prove read-only listing discovery stops before mapping activation and reservation import
        run: |
          ! grep -E '/mappings|/activate|load_future_reservations|Map listing|Activate channel|Load reservations' \
            src/pages/distribution/ConnectionCenterPage.tsx

      - name: Prove no polling or direct Channex access was introduced
        run: |
          ! grep -E 'setInterval|setTimeout|requestAnimationFrame|app\.channex\.io|staging\.channex\.io|user-api-key' \
            src/pages/distribution/ConnectionCenterPage.tsx
