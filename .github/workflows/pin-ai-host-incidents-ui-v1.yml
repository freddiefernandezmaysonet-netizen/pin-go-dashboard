name: Pin AI Host Incident UI V1
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/hostIncidents.ts'
      - 'src/lib/hostIncidentConfig.ts'
      - 'src/pages/pin-ai/**'
      - 'src/pages/public-booking/GuestIncidentUpdates.tsx'
      - 'src/pages/public-booking/GuestCancellationPage.tsx'
      - 'src/app/routes/router.tsx'
      - 'src/app/layout/AppShell.tsx'
      - '.github/workflows/pin-ai-host-incidents-ui-v1.yml'
      - 'package*.json'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic host and guest interaction tests
        run: node --test src/pages/pin-ai/hostIncidents.interaction.test.js
      - name: Strict new components and existing auth boundary configuration
        run: |
          npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/pages/pin-ai/HostIncidentWorkspace.tsx src/pages/public-booking/GuestIncidentUpdates.tsx src/lib/hostIncidentConfig.ts
          npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --lib ES2022,DOM --types vite/client src/pages/pin-ai/HostIncidentsPage.tsx
      - name: Focused lint
        run: npx eslint src/api/hostIncidents.ts src/lib/hostIncidentConfig.ts src/pages/pin-ai/HostIncidentsPage.tsx src/pages/pin-ai/HostIncidentWorkspace.tsx src/pages/public-booking/GuestIncidentUpdates.tsx src/app/routes/router.tsx src/app/layout/AppShell.tsx src/pages/public-booking/GuestCancellationPage.tsx
      - name: Existing guest chat and session isolation regressions
        run: node --test src/pages/public-booking/guestPinAIChat.contract.test.js src/pages/public-booking/guestPinAIChat.interaction.test.js src/auth/public-route-session-isolation.contract.test.js
      - name: Production build without an incident UI activation variable
        run: npm run build
