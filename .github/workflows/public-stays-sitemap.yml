name: Public stays sitemap certification
on:
  pull_request:
    paths:
      - 'middleware.ts'
      - 'middleware.sitemap.test.mjs'
      - '.github/workflows/public-stays-sitemap.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test middleware.sitemap.test.mjs
      - run: npx tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM middleware.ts
      - run: npm run build
