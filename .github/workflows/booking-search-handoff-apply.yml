name: Temporary Booking Search Handoff Apply

on:
  push:
    branches:
      - agent/booking-search-handoff-criteria
    paths:
      - ".github/workflows/booking-search-handoff-apply.yml"

permissions:
  contents: write

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/booking-search-handoff-criteria
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply anchored handoff patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/public-booking/PublicPropertyDetailPage.tsx")
          text = path.read_text()

          replacements = [
            (
              'import { reviewsE1Enabled } from "../../lib/reviewsConfig";\nimport "./PublicBookingExperience.css";',
              'import { reviewsE1Enabled } from "../../lib/reviewsConfig";\nimport { parseBookingSearchHandoff } from "./bookingSearchHandoff";\nimport "./PublicBookingExperience.css";'
            ),
            (
              '  const [checkIn, setCheckIn] = useState("");\n  const [checkOut, setCheckOut] = useState("");',
              '  const bookingSearchHandoff = useMemo(\n    () => parseBookingSearchHandoff(window.location.search),\n    []\n  );\n\n  const [checkIn, setCheckIn] = useState(bookingSearchHandoff?.checkIn ?? "");\n  const [checkOut, setCheckOut] = useState(bookingSearchHandoff?.checkOut ?? "");'
            ),
            (
              '  const [adults, setAdults] = useState(1);\n  const [children, setChildren] = useState(0);',
              '  const [adults, setAdults] = useState(bookingSearchHandoff?.guests ?? 1);\n  const [children, setChildren] = useState(0);'
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f"Expected exactly one anchor, found {count}: {old[:80]!r}")
            text = text.replace(old, new, 1)

          clamp_anchor = '''  function updateAdults(nextValue: number) {\n    const maxGuests = property?.maxGuests ?? 99;\n    const safeValue = Math.max(1, Math.min(nextValue, maxGuests - children));\n    setAdults(safeValue);\n  }'''
          clamp_block = '''  useEffect(() => {\n    const maxGuests = property?.maxGuests;\n    if (!maxGuests || maxGuests < 1) return;\n\n    setAdults((current) => Math.max(1, Math.min(current, maxGuests)));\n  }, [property?.maxGuests]);\n\n''' + clamp_anchor
          count = text.count(clamp_anchor)
          if count != 1:
            raise SystemExit(f"Expected exactly one adult clamp anchor, found {count}")
          text = text.replace(clamp_anchor, clamp_block, 1)

          path.write_text(text)
          PY

      - name: Verify handoff integration markers
        run: |
          grep -F 'parseBookingSearchHandoff(window.location.search)' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'useState(bookingSearchHandoff?.checkIn ?? "")' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'useState(bookingSearchHandoff?.checkOut ?? "")' src/pages/public-booking/PublicPropertyDetailPage.tsx
          grep -F 'useState(bookingSearchHandoff?.guests ?? 1)' src/pages/public-booking/PublicPropertyDetailPage.tsx

      - name: Run handoff contract tests
        run: node --test src/pages/public-booking/bookingSearchHandoff.contract.test.ts

      - name: Install locked dependencies
        run: npm ci --silent --no-audit --no-fund

      - name: Build dashboard
        run: npm run build

      - name: Commit only integration change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/public-booking/PublicPropertyDetailPage.tsx
          test -n "$(git status --porcelain src/pages/public-booking/PublicPropertyDetailPage.tsx)"
          git commit -m "Wire booking search criteria into direct booking"
          git push origin HEAD:agent/booking-search-handoff-criteria
