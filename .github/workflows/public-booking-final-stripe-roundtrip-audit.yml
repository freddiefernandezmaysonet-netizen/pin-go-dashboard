name: Public Booking Final Stripe Round-Trip Audit

on:
  push:
    branches:
      - audit/public-booking-final-stripe-roundtrip

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Create one live Checkout Session without payment
        shell: python
        run: |
          import datetime as dt
          import json
          import sys
          import urllib.error
          import urllib.request

          BASE = "https://remansodepaz.pin-ngo.com/backend/api/public-booking"

          def request_json(url, method="GET", payload=None):
              data = None
              headers = {"Accept": "application/json"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"raw": raw}
                  return error.code, body

          status, property_payload = request_json(f"{BASE}/remansodepaz/remanso?lang=en")
          if status != 200 or not property_payload.get("ok"):
              raise SystemExit(f"property lookup failed: {status} {property_payload}")

          prop = property_payload["property"]
          property_id = prop["id"]
          minimum_nights = int(prop.get("minimumNights") or 1)
          max_guests = int(prop.get("maxGuests") or 1)

          if max_guests < 1:
              raise SystemExit("property does not allow a certification guest")

          today = dt.date.today()
          selected = None
          for offset in range(3, 46):
              check_in = today + dt.timedelta(days=offset)
              check_out = check_in + dt.timedelta(days=minimum_nights)
              status, availability = request_json(
                  f"{BASE}/check-availability",
                  method="POST",
                  payload={
                      "propertyId": property_id,
                      "checkIn": check_in.isoformat(),
                      "checkOut": check_out.isoformat(),
                  },
              )
              if status == 200 and availability.get("ok") and availability.get("available") is True:
                  selected = (check_in.isoformat(), check_out.isoformat())
                  break

          if selected is None:
              raise SystemExit("no available certification date found in the next 45 days")

          check_in, check_out = selected

          status, quote = request_json(
              f"{BASE}/quote",
              method="POST",
              payload={
                  "propertyId": property_id,
                  "checkIn": check_in,
                  "checkOut": check_out,
                  "selectedAmenityIds": [],
              },
          )
          if status != 200 or not quote.get("ok"):
              raise SystemExit(f"quote failed: {status} {quote}")

          total = quote.get("pricing", {}).get("totalAmount")
          if total is None or float(total) <= 0:
              raise SystemExit(f"invalid certification quote total: {total}")

          certification_email = f"stripe-certification+{int(dt.datetime.now(dt.timezone.utc).timestamp())}@pin-ngo.com"
          status, checkout = request_json(
              f"{BASE}/create-checkout",
              method="POST",
              payload={
                  "propertyId": property_id,
                  "checkIn": check_in,
                  "checkOut": check_out,
                  "guestName": "Pin&Go Stripe Certification",
                  "guestEmail": certification_email,
                  "guestPhone": "",
                  "preferredLanguage": "en",
                  "stayNotificationsConsent": False,
                  "guestAcceptedCancellationTerms": True,
                  "guestAcceptedSecurePreCheckinRequirement": True,
                  "adults": 1,
                  "children": 0,
                  "selectedAmenityIds": [],
              },
          )

          if status != 200 or not checkout.get("ok"):
              raise SystemExit(f"create-checkout failed: {status} {checkout}")

          session_id = str(checkout.get("sessionId") or "")
          checkout_url = str(checkout.get("checkoutUrl") or "")
          if not session_id.startswith("cs_live_"):
              raise SystemExit(f"expected live Checkout Session, got {session_id}")
          if not checkout_url.startswith("https://checkout.stripe.com/"):
              raise SystemExit("unexpected Checkout URL host")

          print("STRIPE_ROUNDTRIP_CERTIFICATION=PASS")
          print(f"SESSION_ID={session_id}")
          print(f"CHECK_IN={check_in}")
          print(f"CHECK_OUT={check_out}")
          print(f"TOTAL_AMOUNT={checkout.get('totalAmount')}")
          print(f"CURRENCY={checkout.get('currency')}")
          print("PAYMENT_COMPLETED=false")
